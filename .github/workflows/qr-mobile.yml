name: QR Mobile and Windows preview
on:
  push:
    branches: ["feature/qr-mobile"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and unit test
        working-directory: mobile/android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QR-Mobile-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q server
      - run: node --check web/app.js
      - run: python -m pytest -q tests/runtime
        env:
          PYTHONPATH: server
      - name: Build test installer
        shell: pwsh
        run: |
          $v = [int](Get-Content installer/version.txt)
          Set-Content installer/version.txt ($v + 1) -NoNewline
          python installer/build.py QR_Setup.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: QR-Windows-Preview
          path: |
            QR_Setup.cmd
            QR_Network.ps1
          if-no-files-found: error
